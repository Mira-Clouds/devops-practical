name: PythonAnywhere API Test

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-24.04

    steps:
      - name: Check PythonAnywhere API Authentication
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          curl --fail-with-body \
            --silent \
            --show-error \
            -H "Authorization: Token $PA_TOKEN" \
            "https://www.pythonanywhere.com/api/v0/user/MiraCloud/webapps/"